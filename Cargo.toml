[package]
name = "th-linux-lcd"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Native Linux controller for the Thermaltake TH420V2 Ultra LCD display"
repository = "https://github.com/klatooine/th-linux-lcd"
readme = "README.md"
license = "MIT"
keywords = ["thermaltake", "lcd", "usb", "egui"]
categories = ["hardware-support", "gui"]

[lib]
name = "th_linux_lcd"
path = "src/lib.rs"

[[bin]]
name = "th-linux-lcd"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", features = ["glow"] }
rusb = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = { version = "0.22", features = ["std"] }
ctrlc = { version = "3", features = ["termination"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
