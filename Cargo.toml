[package]
name = "th-linux-lcd"
version = "0.1.0"
edition = "2021"
description = "Native Linux controller for the Thermaltake TH420V2 Ultra LCD display"
repository = "https://github.com/klatooine/th-linux-lcd"
license = "MIT"
keywords = ["thermaltake", "lcd", "usb", "egui"]
categories = ["hardware-support", "gui"]

[dependencies]
eframe = { version = "0.29", features = ["glow"] }
egui = "0.29"
rusb = "0.9"
image = { version = "0.25", features = ["jpeg", "gif", "png"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = { version = "0.22", features = ["std"] }
crossbeam-channel = "0.5"
ctrlc = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
